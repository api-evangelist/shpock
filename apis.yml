name: Shpock
description: >-
  Shpock is a mobile-first second-hand marketplace and classifieds platform that
  brings millions of private buyers and sellers together, primarily across the
  United Kingdom, Austria, and Germany. Users list, discover, and negotiate on
  pre-owned goods across categories including electronics, fashion, home and
  garden, vehicles, and property, alongside a Shpock+ for Professionals program
  for business sellers. Founded in Vienna and backed by Speedinvest, Shpock
  operates consumer iOS/Android apps and a web experience. As of this enrichment
  pass Shpock publishes no public developer API, developer portal, or SDKs; the
  api.shpock.com host exists but is private (returns 401 to unauthenticated
  requests). This profile therefore captures company identity and probed domain
  security rather than an API contract.
